<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>404 — Halaman Tidak Ditemukan</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>

  <style>
    :root {
      --primary: #0A0A0A;
      --accent:  #E8FF47;
      --surface: #F5F5F0;
      --border:  #E5E7EB;
      --muted:   #6B7280;
      --font:    'Plus Jakarta Sans', sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      font-family: var(--font);
      background: var(--primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      position: relative;
      overflow: hidden;
      padding: 24px;
    }
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
    }
    .orb-1 { width:500px; height:500px; background:rgba(232,255,71,0.12); top:-15%; right:-10%; }
    .orb-2 { width:350px; height:350px; background:rgba(99,102,241,0.08); bottom:-10%; left:-5%; }

    .error-card {
      background: #fff;
      border-radius: 24px;
      padding: 56px 48px;
      max-width: 520px;
      width: 100%;
      text-align: center;
      position: relative;
      z-index: 1;
      box-shadow: 0 24px 64px rgba(0,0,0,0.3);
    }

    .error-404-num {
      font-weight: 800;
      font-size: 5rem;
      letter-spacing: -0.06em;
      line-height: 1;
      color: var(--primary);
      margin-bottom: 8px;
      position: relative;
      display: inline-block;
    }
    .error-404-num span { color: var(--accent); -webkit-text-stroke: 2px var(--primary); }

    .error-icon-wrap {
      width: 64px; height: 64px;
      background: var(--surface);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 1.8rem;
      color: var(--primary);
    }

    .error-title {
      font-weight: 800;
      font-size: 1.5rem;
      letter-spacing: -0.03em;
      color: var(--primary);
      margin-bottom: 12px;
    }

    .error-desc {
      font-size: 0.92rem;
      color: var(--muted);
      line-height: 1.7;
      margin-bottom: 32px;
    }

    .btn-error-primary {
      background: var(--primary);
      color: var(--accent);
      border: none;
      border-radius: 11px;
      padding: 13px 28px;
      font-weight: 700;
      font-size: 0.88rem;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.18s;
    }
    .btn-error-primary:hover { background: #222; color: var(--accent); transform: translateY(-2px); }

    .error-footer {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      font-size: 0.76rem;
      color: #C0C0BA;
    }

    @media (max-width: 480px) {
      .error-card { padding: 40px 28px; }
      .error-404-num { font-size: 3.6rem; }
      .btn-error-primary { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>

<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<div class="error-card">

  <div class="error-404-num">4<span>0</span>4</div>

  <div class="error-icon-wrap">
    <i class="bi bi-compass"></i>
  </div>

  <h1 class="error-title">Halaman Tidak Ditemukan</h1>
  <p class="error-desc">
    Maaf, halaman yang Anda cari tidak tersedia atau mungkin sudah dipindahkan.
    Mari kembali ke beranda untuk melanjutkan belanja.
  </p>

  <a href="{{ url_for('landing.index') }}" class="btn-error-primary">
    <i class="bi bi-house-door-fill"></i> Kembali ke Beranda
  </a>

  <div class="error-footer">
    NexShop &middot; E-Commerce Modern
  </div>
</div>

</body>
</html>
